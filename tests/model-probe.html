<!doctype html><meta charset="utf-8"><title>Real litter model check</title><style>body{font:16px system-ui;background:#eef3ed;color:#173c31}pre{white-space:pre-wrap;font-size:12px}#camera{position:relative;width:390px;max-width:100%;height:400px}#camera video{width:100%;height:100%;object-fit:cover}#camera canvas{position:absolute;inset:0;width:100%;height:100%}button{padding:12px;margin:6px}</style><h1>Real litter model check</h1><p id="liveStatus">Loading detector…</p><div id="camera"><video muted autoplay playsinline></video><canvas id="overlay"></canvas></div><p id="tags"></p><button id="multiple">Show multiple items</button><button id="bottle">Show bottle</button><button id="empty">Remove waste</button><pre id="status"></pre><canvas id="image" width="640" height="640" hidden></canvas><script type="module">
import {loadVisionModel as loadWasteModel} from '/vision-client.js';
import {LiveARDetector} from '/live-detector.js';
const status=document.querySelector('#status'),canvas=document.querySelector('canvas');
const source=document.querySelector('#image'),video=document.querySelector('video');
async function scene(i){if(!i){source.getContext('2d').fillStyle='#ddd';source.getContext('2d').fillRect(0,0,source.width,source.height);return;}const image=new Image();image.src=typeof i==='string'?i:'/sample0'+i+'.jpg';await image.decode();source.width=640;source.height=Math.round(image.height/image.width*640);source.getContext('2d').drawImage(image,0,0,source.width,source.height);}
try {const model=await loadWasteModel();status.textContent='Model ready';await scene(4);video.srcObject=source.captureStream(30);await video.play();let dropout=false,calls=0,emptyEvents=0,seen=false;const wrapped={get coverage(){return model.coverage;},detect:async c=>{const result=await model.detect(c);calls++;if(dropout&&calls%3!==0)return [];return result;}};const ar=new LiveARDetector({video,canvas:document.querySelector('#overlay'),loadModel:async()=>wrapped,onStatus:s=>{document.querySelector('#liveStatus').textContent=s;status.textContent='Actual model checks: '+calls+' | Simulated missed checks: '+dropout+' | Empty tag events after first detection: '+emptyEvents;},onDetect:items=>{if(seen&&!items.length)emptyEvents++;if(items.length)seen=true;document.querySelector('#tags').textContent=items.length?items.map(i=>i.label+' · '+i.dustbin).join(' | '):'No waste visible';}});ar.start();document.querySelector('#multiple').onclick=()=>scene(1);document.querySelector('#bottle').onclick=()=>scene(4);document.querySelector('#empty').onclick=()=>scene(0);const btn=document.createElement('button');btn.id='dropout';btn.textContent='Simulate two missed detections';btn.onclick=()=>{dropout=!dropout;emptyEvents=0;};document.body.append(btn);const assist=document.createElement('p');assist.id='assistStatus';document.body.append(assist);
for(const [title,url] of [['Show orange peel','/orange-peel.jpg'],['Show banana peel','/banana-peel.jpg']]){const b=document.createElement('button');b.textContent=title;b.onclick=()=>scene(url);document.body.append(b);}
const gemini=document.createElement('button');gemini.textContent='Ask Gemini for household tags';gemini.onclick=async()=>{try{gemini.disabled=true;const reference=ar.reference(),start=performance.now();assist.textContent='Gemini is checking this public test photo…';const response=await fetch('/probe-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'live-frame',photo:{mime:'image/jpeg',data:source.toDataURL('image/jpeg',.8)}})});const data=await response.json();if(!response.ok)throw Error(data.error);ar.addAssistedTags(data.tagObjects,reference);assist.textContent='Gemini returned '+(data.tagObjects?.length||0)+' boxes in '+Math.round(performance.now()-start)+'ms: '+JSON.stringify(data.tagObjects);}catch(e){assist.textContent=e.message;}finally{gemini.disabled=false;}};document.body.append(gemini);}catch(e){status.textContent+='\n'+e.stack;}
</script>
