<!doctype html><meta charset="utf-8"><title>Real litter model check</title><style>body{font:16px system-ui;background:#eef3ed;color:#173c31}pre{white-space:pre-wrap;font-size:12px}#camera{position:relative;width:390px;max-width:100%;height:400px}#camera video{width:100%;height:100%;object-fit:cover}#camera canvas{position:absolute;inset:0;width:100%;height:100%}button{padding:12px;margin:6px}</style><h1>Real litter model check</h1><p id="liveStatus">Loading detector…</p><div id="camera"><video muted autoplay playsinline></video><canvas id="overlay"></canvas></div><p id="tags"></p><button id="multiple">Show multiple items</button><button id="bottle">Show bottle</button><button id="empty">Remove waste</button><pre id="status"></pre><canvas id="image" width="640" height="640" hidden></canvas><script type="module">
import {loadWasteModel} from '/waste-model.js';
import {LiveARDetector} from '/live-detector.js';
const status=document.querySelector('#status'),canvas=document.querySelector('canvas');
const source=document.querySelector('#image'),video=document.querySelector('video');
async function scene(i){if(!i){source.getContext('2d').fillStyle='#ddd';source.getContext('2d').fillRect(0,0,source.width,source.height);return;}const image=new Image();image.src='/sample0'+i+'.jpg';await image.decode();source.width=640;source.height=Math.round(image.height/image.width*640);source.getContext('2d').drawImage(image,0,0,source.width,source.height);}
try {const model=await loadWasteModel();status.textContent='Model ready';await scene(4);video.srcObject=source.captureStream(30);await video.play();const ar=new LiveARDetector({video,canvas:document.querySelector('#overlay'),loadModel:async()=>model,onStatus:s=>document.querySelector('#liveStatus').textContent=s,onDetect:items=>document.querySelector('#tags').textContent=items.length?items.map(i=>i.label+' · '+i.dustbin).join(' | '):'No waste visible'});ar.start();document.querySelector('#multiple').onclick=()=>scene(1);document.querySelector('#bottle').onclick=()=>scene(4);document.querySelector('#empty').onclick=()=>scene(0);}catch(e){status.textContent+='\n'+e.stack;}
</script>
